name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kalau yang diupload ke GitHub berupa .zip (GitHub tidak meng-unzip sendiri), zip-nya dibuka otomatis di sini.
      - name: Cari proyek (unzip otomatis kalau perlu)
        id: src
        run: |
          if [ ! -f settings.gradle.kts ]; then
            ZIP=$(ls -t ./*.zip 2>/dev/null | head -1 || true)
            if [ -n "$ZIP" ]; then
              echo "Membuka $ZIP"
              mkdir -p _src
              unzip -oq "$ZIP" -d _src
            fi
          fi
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$S" ]; then
            echo "::error::settings.gradle.kts tidak ketemu. Upload isi proyek (atau zip-nya) ke root repo."
            exit 1
          fi
          echo "Proyek ada di: $(dirname "$S")"
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      # Kalau build gagal, baris error-nya dimunculkan di bagian "Annotations" halaman run (gampang di-screenshot).
      - name: Tampilkan error
        if: failure() && steps.src.outputs.dir != ''
        working-directory: ${{ steps.src.outputs.dir }}
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|AAPT|Could not |not found|Unresolved" -A2 build.log 2>/dev/null | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: AiAssist-APK
          path: ${{ steps.src.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
